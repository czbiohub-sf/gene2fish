###### Generated using `argus bootstrap` command ######
stack:
  services:
    gene2fish:
      image:
        tag: sha-af9b9fe
      # Serve mirrored ZFIN images from the CZI-managed private bucket (GEN-45).
      # Staging shares the -dev bucket with rdev (immutable image cache, one
      # seed serves both). The IRSA role trusts exactly serviceaccount
      # argus-gene2fish-staging:gene2fish (sfbiohub-infra
      # terraform/accounts/biohub-nonprod/gene2fish-staging.tf), so the SA name
      # here must stay in sync with that trust policy. The mirror holds exactly
      # the ZFIN-provided Thisse image package (legal requirement); the image
      # proxy falls back to live zfin.org for anything not in the mirror.
      serviceAccount:
        annotations:
          "eks.amazonaws.com/role-arn": arn:aws:iam::911167894392:role/gene2fish-staging
      env:
        - name: GENE2IMAGE_IMAGE_S3_BUCKET
          value: "gene2fish-zfin-images-dev"
        - name: GENE2IMAGE_IMAGE_S3_PREFIX
          value: "gene2fish/zfin-images"
        - name: GENE2IMAGE_IMAGE_S3_REGION
          value: "us-west-2"
      ingress:
        rules:
          - host: gene2fish.apps-staging.czbiohub.org
