###### Generated using `argus bootstrap` command ######
stack:
  global:
    # Prod-only autoscaling (HorizontalPodAutoscaler). Overrides the
    # autoscaling.enabled: false default in common.yaml.
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 70
    # GEN-46: prod is publicly accessible for the ZebraHub embed launch, so
    # the Okta/oauth2-proxy gatekeeping stays disabled. Turning the proxy off
    # here avoids deploying an oauth2-proxy pod that nothing routes to.
    # Staging keeps the Okta protection inherited from common.yaml.
    oidcProxy:
      enabled: false
  services:
    gene2fish:
      image:
        tag: sha-af9b9fe
      # Serve mirrored ZFIN images from the CZI-managed private bucket (GEN-45).
      # The IRSA role trusts exactly serviceaccount argus-gene2fish-prod:gene2fish
      # (sfbiohub-infra terraform/accounts/biohub-prod/gene2fish-prod.tf), so the
      # SA name here must stay in sync with that trust policy. The mirror holds
      # exactly the ZFIN-provided Thisse image package (legal requirement); the
      # image proxy falls back to live zfin.org for anything not in the mirror.
      serviceAccount:
        annotations:
          "eks.amazonaws.com/role-arn": arn:aws:iam::060795925407:role/gene2fish-prod
      env:
        - name: GENE2IMAGE_IMAGE_S3_BUCKET
          value: "gene2fish-zfin-images-prod"
        - name: GENE2IMAGE_IMAGE_S3_PREFIX
          value: "gene2fish/zfin-images"
        - name: GENE2IMAGE_IMAGE_S3_REGION
          value: "us-west-2"
      ingress:
        # GEN-46: Gene2Fish is embedded publicly inside ZebraHub, so the
        # CNTR-101 HTTP basic auth gate (nginx auth-* annotations backed by
        # the out-of-band `basic-auth` secret) is removed along with the Okta
        # gatekeeping. The `basic-auth` secret in the prod namespace becomes
        # unused and can be deleted out-of-band.
        oidcProtected: false
        rules:
          - host: gene2fish.apps.czbiohub.org
