###### Generated using `argus bootstrap` command ######
stack:
  global:
    # Prod-only autoscaling (HorizontalPodAutoscaler). Overrides the
    # autoscaling.enabled: false default in common.yaml.
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 70
    # GEN-46: prod is publicly accessible for the ZebraHub embed launch, so it
    # carries no auth at all: gateway.securityPolicy is "none" below. Staging is
    # gated by the gateway SecurityPolicy (Envoy-native OIDC), not by the retired
    # oauth2-proxy.
  services:
    gene2fish:
      image:
        tag: sha-6d8c40b
      # Serve mirrored ZFIN images from the CZI-managed private bucket (GEN-45).
      # The IRSA role trusts exactly serviceaccount argus-gene2fish-prod:gene2fish
      # (sfbiohub-infra terraform/accounts/biohub-prod/gene2fish-prod.tf), so the
      # SA name set in common.yaml must stay in sync with that trust policy. The mirror holds
      # exactly the ZFIN-provided Thisse image package (legal requirement). The
      # image proxy serves only from it and answers 404 for anything else; the
      # browser then loads that image from zfin.org directly.
      # Requires sfbiohub-infra role gene2fish-prod and the gene2fish-zfin-images-prod
      # bucket to already exist (created by sfbiohub-infra #82); applying this before
      # they are provisioned leaves the pod unable to assume the IRSA role. Probes
      # don't touch S3, so the pod still looks healthy, but every image request
      # returns 502 and logs "Image mirror read failed", and the browser falls back
      # to zfin.org for every image. Check the pod logs after changing this block.
      # (An empty bucket shows up only as 404s, which are not logged.)
      serviceAccount:
        annotations:
          "eks.amazonaws.com/role-arn": arn:aws:iam::060795925407:role/gene2fish-prod
      env:
        - name: GENE2IMAGE_IMAGE_S3_BUCKET
          value: "gene2fish-zfin-images-prod"
        - name: GENE2IMAGE_IMAGE_S3_PREFIX
          value: "gene2fish/zfin-images"
        - name: GENE2IMAGE_IMAGE_S3_REGION
          value: "us-west-2"
      gateway:
        securityPolicy: none
        rules:
          - host: gene2fish.apps.czbiohub.org
            vanity:
              enabled: true
