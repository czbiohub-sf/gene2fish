[project]
name = "gene2image"
version = "0.1.0"
description = "Zebrafish gene expression image browser"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.0.0",
    "pandas>=3.0.2",
    "matplotlib>=3.10.8",
    # Security floors for transitive deps (CVE remediation, GEN-2):
    # starlette CVE-2026-54282 (fixed 1.3.0) + CVE-2026-54283 (fixed 1.3.1),
    # idna CVE-2026-45409 (fixed 3.15)
    "starlette>=1.3.1",
    "idna>=3.15",
    # Read mirrored ZFIN images from our private S3 bucket in the image proxy (GEN-22)
    "boto3>=1.34.0",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/gene2image"]
