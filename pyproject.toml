[project]
name = "gene2image"
version = "0.1.0"
description = "Zebrafish gene expression image browser"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    # Security floors for transitive deps (CVE remediation, GEN-2):
    # starlette CVE-2026-54282 (fixed 1.3.0) + CVE-2026-54283 (fixed 1.3.1),
    # idna CVE-2026-45409 (fixed 3.15)
    "starlette>=1.6.0",
    "idna>=3.15",
    # click PYSEC-2026-2132 (fixed 8.3.3, transitive via uvicorn)
    "click>=8.3.3",
    # Read mirrored ZFIN images from our private S3 bucket in the image proxy (GEN-22)
    "boto3>=1.34.0",
    # Error reporting; the fastapi extra pulls in the Starlette/FastAPI
    # integrations so unhandled route exceptions arrive with request context (GEN-37)
    "sentry-sdk[fastapi]>=2.0.0",
]

[dependency-groups]
# The test suite exercises build-time code — the extractor imports pandas and
# test_extractor_min_records builds pandas DataFrames — so dev includes the
# build group. This keeps `uv run pytest` (dev group only) working without
# pulling pandas/matplotlib back into the runtime dependencies.
dev = ["pytest", "httpx", { include-group = "build" }]
# Build-only deps: pandas drives the ZFIN extractor that bakes the data index at
# image-build time; matplotlib powers the local plotting scripts in scripts/.
# Neither is imported by the running app (data_loader reads JSON via the stdlib),
# so they are kept out of the runtime image to shrink it and its CVE surface
# (GEN-5). pillow is a transitive-via-matplotlib security floor (PYSEC-2026-2253..
# 2257, fixed 12.3.0), so it moves here alongside matplotlib rather than runtime.
build = [
    "pandas>=3.0.2",
    "matplotlib>=3.10.8",
    "pillow>=12.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/gene2image"]
