<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-labelledby="title desc">
  <title id="title">Empty state illustration - gene search</title>
  <desc id="desc">A soft purple illustration with a magnifying glass, DNA helix and zebrafish.</desc>

  <defs>
    <linearGradient id="purpleStroke" x1="90" y1="40" x2="320" y2="220" gradientUnits="userSpaceOnUse">
