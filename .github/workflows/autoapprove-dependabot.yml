###### Generated using `argus bootstrap` command ######
name: Dependabot auto-approve

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_ACTIONS_HELPER_APP_ID }}
          private-key: ${{ secrets.GH_ACTIONS_HELPER_PK }}
      - name: Install gh CLI
        uses: jaxxstorm/action-install-gh-release@v3
        with:
          repo: cli/cli
          tag: v2.30.0
          cache: enable
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
      - name: Approve and enable auto-merge for patch/minor updates
        # Only patch and minor bumps are auto-approved and set to auto-merge.
        # Major bumps can carry breaking changes, so they are left for a human
        # to review and merge (GEN-8). update-type comes from the metadata step
        # above and is one of version-update:semver-{patch,minor,major}.
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
